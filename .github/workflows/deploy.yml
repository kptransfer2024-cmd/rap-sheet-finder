# Build, test and deploy Rap Sheet Finder to GitHub Pages on every push to main.
# Pages must be set to "Source: GitHub Actions" (Settings → Pages).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo; write only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (from package-lock.json)
        run: npm ci

      - name: Unit, safety and UI tests
        run: npm test

      - name: Validate decision graph
        run: npm run validate:graph

      - name: Typecheck and build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
